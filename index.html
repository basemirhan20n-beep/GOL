<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Maç İzle</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Scoreboard ── */
  #scoreboard {
    background: linear-gradient(135deg, #1a1f35, #252b45);
    padding: 10px 16px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #00e5ff33;
    flex-shrink: 0;
  }
  .team-name {
    font-size: 13px;
    font-weight: 700;
    width: 90px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .team-home { text-align: left; color: #4fc3f7; }
  .team-away { text-align: right; color: #ef9a9a; }
  .score-center {
    text-align: center;
    flex: 1;
  }
  #score {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 20px #00e5ff88;
    transition: transform 0.15s;
  }
  #score.goal-flash { transform: scale(1.3); color: #ffd740; }
  #minute {
    font-size: 11px;
    color: #90a4ae;
    margin-top: 2px;
  }
  .tactic-badge {
    font-size: 10px;
    background: #ffffff15;
    border-radius: 4px;
    padding: 2px 5px;
    margin-top: 3px;
    display: inline-block;
  }

  /* ── Canvas ── */
  #field-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ── Event ticker ── */
  #ticker {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #000000cc;
    border: 1px solid #00e5ff44;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 90vw;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  #ticker.show { opacity: 1; }

  /* ── Events log ── */
  #events-log {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 11px;
    color: #cfd8dc;
    text-align: right;
    pointer-events: none;
    line-height: 1.6;
  }

  /* ── Bottom bar ── */
  #bottom-bar {
    background: #1a1f35;
    padding: 8px 12px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    border-top: 1px solid #ffffff11;
  }
  button {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:active { transform: scale(0.97); opacity: 0.85; }
  #btn-play  { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
  #btn-speed { background: #263238; color: #80cbc4; border: 1px solid #37474f; }
  #btn-close { background: #263238; color: #ef9a9a; border: 1px solid #37474f; }

  /* ── Full time overlay ── */
  #fulltime {
    display: none;
    position: absolute;
    inset: 0;
    background: #000000cc;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #fulltime.show { display: flex; }
  #ft-title { font-size: 28px; font-weight: 900; color: #ffd740; text-shadow: 0 0 30px #ffd74088; }
  #ft-score { font-size: 48px; font-weight: 900; color: #fff; }
  #ft-winner { font-size: 16px; color: #80cbc4; }
  #ft-events { font-size: 12px; color: #90a4ae; line-height: 1.8; text-align: center; max-width: 85%; }
</style>
</head>
<body>

<!-- Scoreboard -->
<div id="scoreboard">
  <div>
    <div class="team-name team-home" id="ev-name">Ev Sahibi</div>
    <div class="tactic-badge" id="ev-tactic">4-4-2</div>
  </div>
  <div class="score-center">
    <div id="score">0 – 0</div>
    <div id="minute">⏱ 0'</div>
  </div>
  <div style="text-align:right">
    <div class="team-name team-away" id="dep-name">Deplasman</div>
    <div class="tactic-badge" id="dep-tactic">4-4-2</div>
  </div>
</div>

<!-- Field -->
<div id="field-wrap">
  <canvas id="c"></canvas>
  <div id="events-log"></div>
  <div id="ticker"></div>
  <div id="fulltime">
    <div id="ft-title">⏹ MAÇ BİTTİ</div>
    <div id="ft-score">0 – 0</div>
    <div id="ft-winner"></div>
    <div id="ft-events"></div>
  </div>
</div>

<!-- Controls -->
<div id="bottom-bar">
  <button id="btn-play" onclick="togglePlay()">▶ Başlat</button>
  <button id="btn-speed" onclick="toggleSpeed()">⚡ 1x</button>
  <button id="btn-close" onclick="closePage()">✖ Kapat</button>
</div>

<script>
// ── Telegram WebApp init ──────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Parse URL params ──────────────────────────────────────────
function getParam(key, def = "") {
  return new URLSearchParams(window.location.search).get(key) ?? def;
}

const EV_NAME    = decodeURIComponent(getParam("ev",  "Ev Sahibi"));
const DEP_NAME   = decodeURIComponent(getParam("dep", "Deplasman"));
const EV_GOL     = parseInt(getParam("eg",  "2"));
const DEP_GOL    = parseInt(getParam("dg",  "1"));
const EV_TACTIC  = decodeURIComponent(getParam("et",  "4-4-2"));
const DEP_TACTIC = decodeURIComponent(getParam("dt",  "4-4-2"));
const WEEK       = getParam("w",  "1");
const EVENTS_RAW = decodeURIComponent(getParam("ev_list", ""));
const EV_SCORERS_RAW  = decodeURIComponent(getParam("es", ""));
const DEP_SCORERS_RAW = decodeURIComponent(getParam("ds", ""));

const EVENTS   = EVENTS_RAW  ? EVENTS_RAW.split("|").filter(Boolean)  : [];
const EV_SCORERS  = EV_SCORERS_RAW  ? EV_SCORERS_RAW.split("|").filter(Boolean)  : [];
const DEP_SCORERS = DEP_SCORERS_RAW ? DEP_SCORERS_RAW.split("|").filter(Boolean) : [];

// Update UI labels
document.getElementById("ev-name").textContent   = EV_NAME;
document.getElementById("dep-name").textContent  = DEP_NAME;
document.getElementById("ev-tactic").textContent = EV_TACTIC;
document.getElementById("dep-tactic").textContent= DEP_TACTIC;

// ── Canvas setup ─────────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
let W, H;

function resize() {
  const wrap = document.getElementById("field-wrap");
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener("resize", () => { resize(); });

// ── Game State ───────────────────────────────────────────────
let playing   = false;
let speed     = 1;          // 1 | 2 | 4
let minute    = 0;          // 0..90
let evScore   = 0;
let depScore  = 0;
let animFrame = null;
let lastTs    = null;
let minuteAcc = 0;

// Goal schedule: pick random minutes for each goal
function scheduleGoals() {
  const goals = [];
  const usedMinutes = new Set();
  function randMin(lo, hi) {
    let m;
    do { m = Math.floor(Math.random() * (hi - lo + 1)) + lo; } while (usedMinutes.has(m));
    usedMinutes.add(m);
    return m;
  }
  for (let i = 0; i < EV_GOL; i++)
    goals.push({ team: "ev",  scorer: EV_SCORERS[i]  || "?", min: randMin(5, 88) });
  for (let i = 0; i < DEP_GOL; i++)
    goals.push({ team: "dep", scorer: DEP_SCORERS[i] || "?", min: randMin(5, 88) });

  // Distribute events too
  const evts = EVENTS.map((e, i) => ({ text: e, min: randMin(3, 87) }));
  return goals.concat(evts).sort((a, b) => a.min - b.min);
}
let schedule = scheduleGoals();
let scheduleIdx = 0;

// ── Players ──────────────────────────────────────────────────
const FORMATIONS = {
  "4-4-2":   [[0.5,0.92],[0.2,0.78],[0.4,0.78],[0.6,0.78],[0.8,0.78],[0.15,0.58],[0.38,0.58],[0.62,0.58],[0.85,0.58],[0.35,0.38],[0.65,0.38]],
  "4-3-3":   [[0.5,0.92],[0.2,0.78],[0.4,0.78],[0.6,0.78],[0.8,0.78],[0.25,0.60],[0.5,0.55],[0.75,0.60],[0.25,0.35],[0.5,0.28],[0.75,0.35]],
  "4-2-3-1": [[0.5,0.92],[0.2,0.78],[0.4,0.78],[0.6,0.78],[0.8,0.78],[0.35,0.64],[0.65,0.64],[0.2,0.46],[0.5,0.42],[0.8,0.46],[0.5,0.28]],
  "5-3-2":   [[0.5,0.92],[0.12,0.76],[0.3,0.74],[0.5,0.76],[0.7,0.74],[0.88,0.76],[0.25,0.54],[0.5,0.50],[0.75,0.54],[0.35,0.32],[0.65,0.32]],
  "3-5-2":   [[0.5,0.92],[0.25,0.76],[0.5,0.74],[0.75,0.76],[0.1,0.56],[0.3,0.54],[0.5,0.50],[0.7,0.54],[0.9,0.56],[0.35,0.32],[0.65,0.32]],
};

function makePlayer(fx, fy, color, numColor) {
  return { bx: fx, by: fy, x: 0, y: 0, vx: 0, vy: 0, color, numColor, wobble: Math.random() * Math.PI * 2 };
}

const EV_COLOR  = [0x4f, 0xc3, 0xf7]; // blue
const DEP_COLOR = [0xef, 0x9a, 0x9a]; // red

function buildPlayers(formation, side, clr) {
  const pos = FORMATIONS[formation] || FORMATIONS["4-4-2"];
  return pos.map(([fx, fy]) => {
    // side=ev → lower half (y > 0.5), side=dep → upper half mirrored
    const ry = side === "ev" ? fy : 1 - fy;
    const nc = side === "ev" ? "#0d1b2a" : "#1a0000";
    return makePlayer(fx, ry, `rgb(${clr.join(",")})`, nc);
  });
}

let evPlayers  = buildPlayers(EV_TACTIC,  "ev",  EV_COLOR);
let depPlayers = buildPlayers(DEP_TACTIC, "dep", DEP_COLOR);

// Ball
const ball = { x: 0.5, y: 0.5, vx: 0, vy: 0, radius: 6 };

// ── Draw Field ───────────────────────────────────────────────
function drawField() {
  // Base grass
  ctx.fillStyle = "#1b5e20";
  ctx.fillRect(0, 0, W, H);

  // Stripes
  const stripes = 8;
  for (let i = 0; i < stripes; i++) {
    ctx.fillStyle = i % 2 === 0 ? "#1b6423" : "#1a5e20";
    ctx.fillRect(0, (H / stripes) * i, W, H / stripes);
  }

  // Lines
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);

  // Boundary
  const px = W * 0.05, py = H * 0.03, pw = W * 0.9, ph = H * 0.94;
  ctx.strokeRect(px, py, pw, ph);

  // Halfway
  ctx.beginPath(); ctx.moveTo(px, H / 2); ctx.lineTo(px + pw, H / 2); ctx.stroke();

  // Centre circle
  ctx.beginPath(); ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.1, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 3, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();

  // Penalty areas
  const paW = pw * 0.45, paH = ph * 0.18;
  ctx.strokeRect(px + (pw - paW) / 2, py, paW, paH);                     // top
  ctx.strokeRect(px + (pw - paW) / 2, py + ph - paH, paW, paH);          // bottom

  // Goal areas
  const gaW = pw * 0.25, gaH = ph * 0.07;
  ctx.strokeRect(px + (pw - gaW) / 2, py, gaW, gaH);
  ctx.strokeRect(px + (pw - gaW) / 2, py + ph - gaH, gaW, gaH);

  // Goals
  const gW = pw * 0.15, gH = ph * 0.025;
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(px + (pw - gW) / 2, py - gH, gW, gH);
  ctx.fillRect(px + (pw - gW) / 2, py + ph, gW, gH);
  ctx.strokeRect(px + (pw - gW) / 2, py - gH, gW, gH);
  ctx.strokeRect(px + (pw - gW) / 2, py + ph, gW, gH);
}

// ── Update positions ─────────────────────────────────────────
function syncPositions() {
  [...evPlayers, ...depPlayers].forEach(p => {
    p.x = p.bx * W;
    p.y = p.by * H;
  });
  ball.x = W / 2; ball.y = H / 2;
}
syncPositions();

let ballTarget = null; // {x, y, progress, duration}

function randomWobble(players, t) {
  players.forEach(p => {
    p.wobble += 0.03;
    const dx = Math.sin(p.wobble + t * 0.0002) * 8;
    const dy = Math.cos(p.wobble * 0.7 + t * 0.0003) * 6;
    p.x = p.bx * W + dx;
    p.y = p.by * H + dy;
  });
}

// ── Goal animation ───────────────────────────────────────────
let goalFlash = 0; // countdown frames
let goalText  = "";

function triggerGoal(team, scorer) {
  if (team === "ev") evScore++;
  else depScore++;
  updateScore();
  goalText  = `⚽ GOL! ${scorer}`;
  goalFlash = 90;
  showTicker(`⚽ GOL! ${scorer} — ${evScore}:${depScore}`);
  addEventLog(team === "ev" ? "🔵" : "🔴", `${minute}' ⚽ ${scorer}`);

  // Animate ball toward goal
  const targetY = team === "ev" ? 0.02 : 0.98;
  ballTarget = { tx: 0.5, ty: targetY, prog: 0, dur: 40 };
}

function triggerEvent(text) {
  showTicker(text);
  addEventLog("📋", `${minute}' ${text}`);
}

function showTicker(msg) {
  const el = document.getElementById("ticker");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 3000);
}

const eventLogLines = [];
function addEventLog(icon, text) {
  eventLogLines.unshift(`${icon} ${text}`);
  if (eventLogLines.length > 5) eventLogLines.pop();
  document.getElementById("events-log").innerHTML = eventLogLines.join("<br>");
}

function updateScore() {
  const el = document.getElementById("score");
  el.textContent = `${evScore} – ${depScore}`;
  el.classList.add("goal-flash");
  setTimeout(() => el.classList.remove("goal-flash"), 300);
}

// ── Main loop ────────────────────────────────────────────────
const MS_PER_GAME_MIN = 1000; // real ms per game minute at 1x

function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 100);
  lastTs = ts;

  minuteAcc += dt * speed;
  while (minuteAcc >= MS_PER_GAME_MIN && minute < 90) {
    minuteAcc -= MS_PER_GAME_MIN;
    minute++;
    document.getElementById("minute").textContent = `⏱ ${minute}'`;

    // Fire scheduled events
    while (scheduleIdx < schedule.length && schedule[scheduleIdx].min <= minute) {
      const ev = schedule[scheduleIdx++];
      if (ev.team) triggerGoal(ev.team, ev.scorer);
      else         triggerEvent(ev.text);
    }

    if (minute >= 90) { endGame(); return; }
  }

  // Ball movement
  if (ballTarget) {
    ballTarget.prog++;
    const t = ballTarget.prog / ballTarget.dur;
    ball.x = W * (0.5 + (ballTarget.tx - 0.5) * t);
    ball.y = H * (0.5 + (ballTarget.ty - 0.5) * t);
    if (ballTarget.prog >= ballTarget.dur) {
      ballTarget = null;
      ball.x = W * 0.5; ball.y = H * 0.5;
    }
  } else {
    // Gentle random drift
    ball.vx += (Math.random() - 0.5) * 0.5;
    ball.vy += (Math.random() - 0.5) * 0.5;
    ball.vx *= 0.92; ball.vy *= 0.92;
    ball.x = Math.max(W * 0.06, Math.min(W * 0.94, ball.x + ball.vx));
    ball.y = Math.max(H * 0.06, Math.min(H * 0.94, ball.y + ball.vy));
  }

  randomWobble(evPlayers,  ts);
  randomWobble(depPlayers, ts);

  draw(ts);

  if (playing && minute < 90) animFrame = requestAnimationFrame(loop);
}

function draw(ts) {
  ctx.clearRect(0, 0, W, H);
  drawField();

  // Goal flash overlay
  if (goalFlash > 0) {
    goalFlash--;
    const alpha = (goalFlash / 90) * 0.35;
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = `rgba(255,215,0,${alpha * 2})`;
    ctx.font = `bold ${Math.floor(W * 0.08)}px 'Segoe UI'`;
    ctx.textAlign = "center";
    ctx.fillText(goalText, W / 2, H * 0.45);
  }

  // Players
  drawPlayers(evPlayers,  EV_COLOR);
  drawPlayers(depPlayers, DEP_COLOR);

  // Ball
  const grd = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.radius);
  grd.addColorStop(0, "#fff");
  grd.addColorStop(1, "#ccc");
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = grd;
  ctx.fill();
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1;
  ctx.stroke();

  // Minute progress bar
  const prog = minute / 90;
  ctx.fillStyle = "#00000066";
  ctx.fillRect(0, H - 3, W, 3);
  ctx.fillStyle = minute >= 75 ? "#ef5350" : "#00e676";
  ctx.fillRect(0, H - 3, W * prog, 3);
}

function drawPlayers(players, clr) {
  players.forEach((p, i) => {
    const r = i === 0 ? 9 : 7.5;
    // Shadow
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + r * 0.6, r * 0.8, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();

    // Body
    const grad = ctx.createRadialGradient(p.x - 2, p.y - 2, 1, p.x, p.y, r);
    grad.addColorStop(0, `rgba(${clr.join(",")},1)`);
    grad.addColorStop(1, `rgba(${Math.max(0,clr[0]-40)},${Math.max(0,clr[1]-40)},${Math.max(0,clr[2]-40)},1)`);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Number
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${i === 0 ? 8 : 7}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(i + 1, p.x, p.y);
  });
}

// ── End game ─────────────────────────────────────────────────
function endGame() {
  playing = false;
  document.getElementById("btn-play").textContent = "▶ Tekrar";

  let winner;
  if (evScore > depScore)       winner = `🏆 ${EV_NAME} Kazandı!`;
  else if (depScore > evScore)  winner = `🏆 ${DEP_NAME} Kazandı!`;
  else                          winner = "🤝 Berabere!";

  document.getElementById("ft-score").textContent  = `${evScore} – ${depScore}`;
  document.getElementById("ft-winner").textContent = winner;

  const allEvts = eventLogLines.slice().reverse().join("\n");
  document.getElementById("ft-events").textContent = allEvts || "";
  document.getElementById("fulltime").classList.add("show");
}

// ── Controls ─────────────────────────────────────────────────
function togglePlay() {
  if (minute >= 90) {
    // Reset
    minute = 0; evScore = 0; depScore = 0; minuteAcc = 0; scheduleIdx = 0;
    schedule = scheduleGoals();
    document.getElementById("score").textContent = "0 – 0";
    document.getElementById("minute").textContent = "⏱ 0'";
    document.getElementById("events-log").innerHTML = "";
    eventLogLines.length = 0;
    document.getElementById("fulltime").classList.remove("show");
    syncPositions();
  }
  playing = !playing;
  document.getElementById("btn-play").textContent = playing ? "⏸ Durdur" : "▶ Devam";
  if (playing) { lastTs = null; animFrame = requestAnimationFrame(loop); }
  else if (animFrame) cancelAnimationFrame(animFrame);
}

const speeds = [1, 2, 4];
let speedIdx = 0;
function toggleSpeed() {
  speedIdx = (speedIdx + 1) % speeds.length;
  speed    = speeds[speedIdx];
  document.getElementById("btn-speed").textContent = `⚡ ${speed}x`;
}

function closePage() {
  if (tg) tg.close();
  else window.close();
}

// Initial draw
syncPositions();
draw(0);
</script>
</body>
</html>
